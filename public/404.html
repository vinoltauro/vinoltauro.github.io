<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Vinol Tauro</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('vt-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" />
    <style>
      :root { --bg:#f5f4f0; --surface:#fbfaf7; --ink:#16181d; --muted:#65686f; --line:#e4e2db; --accent:#1f3bff; --on-accent:#fff; color-scheme: light; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --bg:#0d0e11; --surface:#15161a; --ink:#ecebe7; --muted:#9a9da4; --line:#24262b; --accent:#8a97ff; --on-accent:#0d0e11; color-scheme: dark; } }
      :root[data-theme='dark'] { --bg:#0d0e11; --surface:#15161a; --ink:#ecebe7; --muted:#9a9da4; --line:#24262b; --accent:#8a97ff; --on-accent:#0d0e11; color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px max(28px, env(safe-area-inset-left)); background: var(--bg); color: var(--ink); font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { max-width: 620px; }
      .code { margin: 0 0 22px; color: var(--accent); font: 500 12.5px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0 0 18px; font-family: 'Bricolage Grotesque', Georgia, serif; font-size: clamp(2.2rem, 7vw, 3.6rem); font-weight: 800; line-height: 1.02; letter-spacing: -.035em; text-wrap: balance; }
      h1 span { color: var(--accent); }
      p { margin: 0 0 32px; max-width: 50ch; color: var(--muted); font-size: 1.08rem; line-height: 1.6; text-wrap: pretty; }
      a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 100px; background: var(--accent); color: var(--on-accent); font-weight: 600; text-decoration: none; transition: transform .3s cubic-bezier(.16,1,.3,1); }
      a:hover { transform: translateY(-2px); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · page not found</p>
      <h1>This page suffered catastrophic forgetting<span>.</span></h1>
      <p>Whatever was here, the network doesn’t remember it any more. My dissertation is about exactly this problem. The rest of the site is fine.</p>
      <a href="/">← Back to the site</a>
    </main>
  </body>
</html>
