    <!-- Runs before paint: apply saved theme (no flash), flag JS for progressive-enhancement motion.
         Failsafe: if the app never boots, drop the flag so nothing stays hidden. -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('vt-theme');
          if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
          if (localStorage.getItem('vt-skim') === '1') d.setAttribute('data-skim', '');
        } catch (e) {}
        setTimeout(function () {
          if (window.__vtReady) return;
          d.classList.remove('js');
          var s = document.createElement('style');
          s.textContent = '[style*="opacity:0"]{opacity:1!important;transform:none!important;filter:none!important}.role-details{height:auto!important}.role-toggle{display:none!important}';
          document.head.appendChild(s);
        }, 4000);
      })();
    </script>


    <!-- Without JS, show every scroll-reveal element at rest instead of its hidden start state. -->
    <noscript><style>[style*="opacity:0"]{opacity:1!important;transform:none!important;filter:none!important}.role-details{height:auto!important}.role-toggle{display:none!important}</style></noscript>
